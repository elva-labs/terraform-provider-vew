name: Checks

on:
  pull_request:
    branches: [main, beta]
  push:
    branches: [main, beta]

permissions:
  contents: read

concurrency:
  group: checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  docs:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: false
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: 1.16.3
          terraform_wrapper: false
      - name: Check Registry documentation
        run: python3 scripts/registry_docs.py check

  tests:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    env:
      TF_ACC: "0"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: false
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: 1.16.3
          terraform_wrapper: false
      - name: Install race detector C compiler
        run: |
          if ! command -v gcc >/dev/null; then
            if [ "$(id -u)" -eq 0 ]; then
              apt-get update && apt-get install -y --no-install-recommends gcc libc6-dev
            else
              sudo apt-get update && sudo apt-get install -y --no-install-recommends gcc libc6-dev
            fi
          fi
      - name: Run Go tests with the race detector
        run: go test ./... -race -count=1

  static:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.16.3
          terraform_wrapper: false
      - name: Check Go formatting
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "gofmt needed for:" >&2
            echo "$unformatted" >&2
            exit 1
          fi
      - name: Run go vet
        run: go vet ./...
      - name: Validate examples
        run: python3 scripts/validate_examples.py
