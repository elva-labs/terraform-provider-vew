name: Release provider

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version tag to publish (main v0.2.0, beta v0.2.0-beta.1)
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: provider-release
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/beta'
    runs-on: ubuntu-24.04-arm
    env:
      TF_ACC: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.16.3
          terraform_wrapper: false
      - name: Install race detector C compiler
        run: |
          if ! command -v gcc >/dev/null; then
            if [ "$(id -u)" -eq 0 ]; then
              apt-get update && apt-get install -y --no-install-recommends gcc libc6-dev
            else
              sudo apt-get update && sudo apt-get install -y --no-install-recommends gcc libc6-dev
            fi
          fi
      - name: Check tests and Registry documentation
        run: |
          go test ./... -race -count=1
          python3 scripts/registry_docs.py check
      - name: Validate release version and commit
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_BRANCH: ${{ github.ref_name }}
        shell: bash
        run: |
          stable_version='v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)'
          case "$RELEASE_BRANCH" in
            main)
              if [[ ! "$RELEASE_VERSION" =~ ^${stable_version}$ ]]; then
                echo "main requires a stable version tag such as v0.2.0" >&2
                exit 1
              fi
              ;;
            beta)
              if [[ ! "$RELEASE_VERSION" =~ ^${stable_version}-beta\.(0|[1-9][0-9]*)$ ]]; then
                echo "beta requires a version tag such as v0.2.0-beta.1" >&2
                exit 1
              fi
              ;;
            *)
              echo "Release from main or beta only" >&2
              exit 1
              ;;
          esac
          git fetch origin "$RELEASE_BRANCH" --tags
          if [[ "$(git rev-parse HEAD)" != "$(git rev-parse "origin/$RELEASE_BRANCH")" ]]; then
            echo "Release the current $RELEASE_BRANCH commit only" >&2
            exit 1
          fi
          if git show-ref --verify --quiet "refs/tags/$RELEASE_VERSION"; then
            if [[ "$(git rev-list -n 1 "$RELEASE_VERSION")" != "$(git rev-parse HEAD)" ]]; then
              echo "Version tag already points to a different commit" >&2
              exit 1
            fi
          fi
      - name: Import release signing key
        id: import_gpg
        uses: crazy-max/ghaction-import-gpg@2dc316deee8e90f13e1a351ab510b4d5bc0c82cd # v7.0.0
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.PASSPHRASE }}
      - name: Check GoReleaser configuration
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          version: v2.18.2
          args: check
      - name: Create version tag on release commit
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          if ! git show-ref --verify --quiet "refs/tags/$RELEASE_VERSION"; then
            git tag "$RELEASE_VERSION"
            git push origin "$RELEASE_VERSION"
          fi
      - name: Build, sign, and publish GitHub release
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          version: v2.18.2
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GPG_FINGERPRINT: ${{ steps.import_gpg.outputs.fingerprint }}
          GORELEASER_CURRENT_TAG: ${{ inputs.version }}
